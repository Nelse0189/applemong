[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reddit-upload"
version = "0.1.0"
description = "Upload a picture or GIF to subreddits you preselect."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "praw>=8.0.3",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
reddit-upload = "reddit_upload.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
